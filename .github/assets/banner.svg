<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="interior-architect — a senior interior architect for Claude">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe6"/>
      <stop offset="1" stop-color="#eadfcf"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d8c9b4" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c98b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f3c98b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect x="700" y="0" width="580" height="420" fill="url(#grid)" opacity="0.7"/>

  <!-- Floor plan drawing -->
  <g transform="translate(760 48)" fill="none" stroke="#2f2a26" stroke-linecap="round" stroke-linejoin="round">
    <!-- daylight wedge -->
    <path d="M110 0 L40 150 L300 150 L230 0 Z" fill="url(#sun)" stroke="none"/>
    <!-- outer walls -->
    <path d="M110 0 H0 V324 H460 V0 H230" stroke-width="7"/>
    <!-- window -->
    <path d="M110 0 H230" stroke-width="2"/>
    <path d="M110 -4 H230 M110 4 H230" stroke-width="1"/>
    <!-- internal wall -->
    <path d="M290 0 V140 M290 200 V324" stroke-width="5"/>
    <!-- door swing -->
    <path d="M290 140 L340 140" stroke-width="2"/>
    <path d="M340 140 A50 50 0 0 1 290 190" stroke-width="1.2" stroke-dasharray="4 4"/>
    <!-- sofa -->
    <rect x="40" y="220" width="170" height="62" rx="12" stroke-width="2.2" fill="#c9a27e" fill-opacity="0.35"/>
    <path d="M52 232 H198" stroke-width="1"/>
    <!-- rug -->
    <rect x="28" y="120" width="194" height="150" rx="4" stroke-width="1.4" stroke-dasharray="2 5" stroke="#b5562f"/>
    <!-- round coffee table (curvature) -->
    <circle cx="125" cy="175" r="30" stroke-width="2" fill="#f6efe6"/>
    <!-- armchair -->
    <rect x="232" y="150" width="44" height="50" rx="10" stroke-width="2"/>
    <!-- plant -->
    <circle cx="262" cy="40" r="16" stroke="#5f7a4f" stroke-width="2" fill="#8fa77a" fill-opacity="0.35"/>
    <path d="M262 28 Q256 40 262 52 M250 40 Q262 34 274 40" stroke="#5f7a4f" stroke-width="1.2"/>
    <!-- bed -->
    <rect x="330" y="210" width="110" height="96" rx="6" stroke-width="2.2"/>
    <rect x="340" y="216" width="40" height="22" rx="6" stroke-width="1.4"/>
    <rect x="390" y="216" width="40" height="22" rx="6" stroke-width="1.4"/>
    <!-- wardrobe -->
    <rect x="310" y="20" width="130" height="40" stroke-width="2" fill="#2f2a26" fill-opacity="0.07"/>
    <path d="M343 20 V60 M375 20 V60 M408 20 V60" stroke-width="1"/>
    <!-- dimension line -->
    <g stroke="#b5562f" stroke-width="1.2">
      <path d="M0 350 H460"/>
      <path d="M0 343 V357 M460 343 V357"/>
    </g>
    <text x="230" y="372" fill="#b5562f" stroke="none" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">460 cm · M</text>
  </g>

  <!-- Title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#2f2a26">
    <text x="72" y="92" font-size="15" letter-spacing="4" fill="#b5562f" font-weight="600">CLAUDE PLUGIN · AGENT SKILL</text>
    <text x="72" y="162" font-size="64" font-weight="700" letter-spacing="-1.5">interior-architect</text>
    <text x="72" y="208" font-size="24" fill="#5b524a">A senior interior architect that thinks</text>
    <text x="72" y="240" font-size="24" fill="#5b524a">about how you live — and every detail.</text>
    <g font-size="14" font-weight="600">
      <rect x="72" y="282" width="112" height="32" rx="16" fill="#2f2a26"/>
      <text x="128" y="303" text-anchor="middle" fill="#f6efe6">6 lenses</text>
      <rect x="194" y="282" width="128" height="32" rx="16" fill="none" stroke="#2f2a26" stroke-width="1.4"/>
      <text x="258" y="303" text-anchor="middle">8 commands</text>
      <rect x="332" y="282" width="112" height="32" rx="16" fill="none" stroke="#2f2a26" stroke-width="1.4"/>
      <text x="388" y="303" text-anchor="middle">2 agents</text>
      <rect x="454" y="282" width="150" height="32" rx="16" fill="none" stroke="#2f2a26" stroke-width="1.4"/>
      <text x="529" y="303" text-anchor="middle">20+ references</text>
    </g>
    <text x="72" y="360" font-size="14" fill="#8a7d70">brief · survey · concept · develop · detail · build · handover</text>
  </g>
</svg>
